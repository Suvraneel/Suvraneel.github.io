# Type-check, lint and build every pull request (and every push to develop),
# so Mergify only merges a branch that would deploy: .mergify.yml waits for
# this job's check ("ci") to pass.
name: CI

on:
  pull_request:
  push:
    branches: ["develop"]

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, as in the deploy: sitemap lastmod reads each page's last commit date.
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build static export
        run: bun run build
